[project]
name = "steamrec"
version = "0.1.0"
description = "Hybrid Steam game recommender: item-to-item collaborative filtering + content-based filtering"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
]

[dependency-groups]
dev = [
    "jupyter",
    "kagglehub",
    "matplotlib",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamrec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
